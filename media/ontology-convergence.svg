<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="340" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Silver as an Ontology in Disguise</text>

  <!-- Sources subgraph -->
  <rect x="40" y="70" width="300" height="210" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="60" y="92" font-size="12" font-weight="600" fill="#64748b">Two schemas, two formats</text>

  <rect x="70" y="108" width="240" height="62" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="190" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#0c4a6e">orders.csv</text>
  <text x="190" y="152" text-anchor="middle" font-size="11.5" fill="#0c4a6e">order_id, order_date, unit_price</text>

  <rect x="70" y="192" width="240" height="62" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="190" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">invoice.xml</text>
  <text x="190" y="236" text-anchor="middle" font-size="11.5" fill="#4c1d95">Invoice/@id, @issued, Amount</text>

  <!-- Ontology concept (circle) -->
  <circle cx="530" cy="175" r="66" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="530" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">Ontology</text>
  <text x="530" y="190" text-anchor="middle" font-size="12" fill="#713f12">concept: SALE</text>

  <!-- Silver -->
  <rect x="680" y="140" width="190" height="70" rx="8" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="775" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">silver.sales</text>
  <text x="775" y="186" text-anchor="middle" font-size="11" fill="#374151">source_system, txn_date,</text>
  <text x="775" y="200" text-anchor="middle" font-size="11" fill="#374151">revenue</text>

  <!-- Arrows -->
  <g stroke="#475569" stroke-width="1.8" fill="none">
    <line x1="310" y1="139" x2="470" y2="160" marker-end="url(#arrow)"/>
    <line x1="310" y1="223" x2="470" y2="190" marker-end="url(#arrow)"/>
    <line x1="596" y1="175" x2="678" y2="175" marker-end="url(#arrow)"/>
  </g>
  <g font-size="11" fill="#64748b">
    <text x="360" y="140">maps to</text>
    <text x="360" y="222">maps to</text>
  </g>
</svg>
