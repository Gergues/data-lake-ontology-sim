<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrowg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Adding a Third Source — Meaning Changes, Gold Doesn't</text>

  <!-- Column headers -->
  <text x="120" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">Source systems</text>
  <text x="410" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">Silver — convergence</text>
  <text x="720" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">Silver → Gold</text>

  <!-- Sources -->
  <rect x="40" y="96" width="160" height="56" rx="9" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="120" y="120" text-anchor="middle" font-size="13" font-weight="600" fill="#0c4a6e">Orders</text>
  <text x="120" y="138" text-anchor="middle" font-size="11" fill="#0c4a6e">(CSV)</text>

  <rect x="40" y="176" width="160" height="56" rx="9" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="120" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#4c1d95">Invoicing</text>
  <text x="120" y="218" text-anchor="middle" font-size="11" fill="#4c1d95">(SOAP/XML)</text>

  <rect x="40" y="256" width="160" height="56" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="120" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">POS  (JSON)</text>
  <text x="120" y="298" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">NEW</text>

  <!-- Adapters -->
  <rect x="330" y="96" width="180" height="56" rx="9" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="420" y="129" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" fill="#334155">_orders_raw()</text>
  <rect x="330" y="176" width="180" height="56" rx="9" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="420" y="209" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#334155">_invoices_raw()</text>
  <rect x="330" y="256" width="180" height="56" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="420" y="284" text-anchor="middle" font-size="12.5" font-family="Consolas, monospace" fill="#14532d">_pos_raw()</text>
  <text x="420" y="302" text-anchor="middle" font-size="10.5" font-weight="700" fill="#166534">+1 adapter, +1 line</text>

  <!-- Sales table -->
  <rect x="330" y="356" width="180" height="66" rx="9" fill="#e5e7eb" stroke="#6b7280"/>
  <text x="420" y="384" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">sales</text>
  <text x="420" y="404" text-anchor="middle" font-size="10.5" fill="#374151">one shared schema</text>

  <!-- Gold -->
  <rect x="640" y="176" width="180" height="120" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="730" y="206" text-anchor="middle" font-size="14" font-weight="700" fill="#713f12">Gold</text>
  <text x="730" y="226" text-anchor="middle" font-size="11" fill="#713f12">4 marts</text>
  <text x="730" y="252" text-anchor="middle" font-size="12" font-weight="700" fill="#a16207">UNCHANGED</text>
  <text x="730" y="274" text-anchor="middle" font-size="10" fill="#713f12">by-source mart gains a</text>
  <text x="730" y="288" text-anchor="middle" font-size="10" fill="#713f12">'pos' row for free</text>

  <!-- Source -> adapter arrows -->
  <g stroke="#475569" stroke-width="1.8" fill="none">
    <line x1="200" y1="124" x2="328" y2="124" marker-end="url(#arrow)"/>
    <line x1="200" y1="204" x2="328" y2="204" marker-end="url(#arrow)"/>
  </g>
  <line x1="200" y1="284" x2="328" y2="284" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrowg)"/>

  <!-- adapters -> sales -->
  <g stroke="#475569" stroke-width="1.8" fill="none">
    <line x1="420" y1="152" x2="420" y2="354" marker-end="url(#arrow)"/>
    <line x1="420" y1="232" x2="420" y2="354" marker-end="url(#arrow)"/>
  </g>
  <line x1="420" y1="312" x2="420" y2="354" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrowg)"/>

  <!-- sales -> gold -->
  <path d="M510 380 C 580 380, 590 250, 638 240" stroke="#475569" stroke-width="1.9" fill="none" marker-end="url(#arrow)"/>
  <text x="560" y="330" font-size="10.5" fill="#475569">groups by source_system</text>

  <!-- Legend -->
  <g font-size="11.5">
    <rect x="330" y="452" width="16" height="16" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="354" y="465" fill="#166534" font-weight="600">new work (meaning + plumbing)</text>
    <rect x="600" y="452" width="16" height="16" rx="3" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="624" y="465" fill="#713f12" font-weight="600">no change — business logic reused</text>
  </g>
</svg>
