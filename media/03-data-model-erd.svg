<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1040" height="720" fill="#ffffff"/>
  <text x="520" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Entity Relationship Diagram — Orders &amp; Invoices</text>

  <!-- Relationship lines (drawn first, behind entities) -->
  <g stroke="#94a3b8" stroke-width="1.6" fill="none">
    <line x1="160" y1="132" x2="160" y2="300"/>            <!-- CATEGORY -> PRODUCT -->
    <line x1="260" y1="348" x2="380" y2="500"/>            <!-- PRODUCT -> ORDER_LINE -->
    <line x1="260" y1="360" x2="760" y2="480"/>            <!-- PRODUCT -> INVOICE_LINE -->
    <line x1="500" y1="154" x2="495" y2="430"/>            <!-- CUSTOMER -> ORDER_LINE -->
    <line x1="620" y1="112" x2="760" y2="120"/>            <!-- CUSTOMER -> INVOICE -->
    <line x1="865" y1="176" x2="865" y2="420"/>            <!-- INVOICE -> INVOICE_LINE -->
  </g>
  <g font-size="11" fill="#475569">
    <text x="168" y="220">classifies</text>
    <text x="300" y="420">appears in</text>
    <text x="470" y="400">appears in</text>
    <text x="440" y="300">places</text>
    <text x="640" y="100">billed on</text>
    <text x="872" y="300">contains</text>
  </g>
  <!-- crow's-foot hints (1 .. many) -->
  <g font-size="12" font-weight="700" fill="#0f766e">
    <text x="150" y="150">1</text><text x="150" y="296">&#8734;</text>
    <text x="252" y="342">1</text><text x="366" y="500">&#8734;</text>
    <text x="252" y="372">1</text><text x="748" y="482">&#8734;</text>
    <text x="508" y="170">1</text><text x="500" y="426">&#8734;</text>
    <text x="612" y="128">1</text><text x="748" y="118">&#8734;</text>
    <text x="852" y="196">1</text><text x="852" y="416">&#8734;</text>
  </g>

  <!-- CATEGORY -->
  <g>
    <rect x="60" y="80" width="200" height="52" rx="6" fill="#f8fafc" stroke="#0f766e" stroke-width="1.5"/>
    <rect x="60" y="80" width="200" height="24" rx="6" fill="#0f766e"/>
    <text x="160" y="97" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">CATEGORY</text>
    <text x="72" y="122" font-size="12" fill="#334155"><tspan font-weight="700">PK</tspan> category</text>
  </g>

  <!-- PRODUCT -->
  <g>
    <rect x="60" y="300" width="200" height="96" rx="6" fill="#f8fafc" stroke="#0f766e" stroke-width="1.5"/>
    <rect x="60" y="300" width="200" height="24" rx="6" fill="#0f766e"/>
    <text x="160" y="317" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">PRODUCT</text>
    <text x="72" y="342" font-size="12" fill="#334155"><tspan font-weight="700">PK</tspan> product</text>
    <text x="72" y="364" font-size="12" fill="#334155"><tspan font-weight="700">FK</tspan> category</text>
    <text x="72" y="386" font-size="12" fill="#334155">unit_price</text>
  </g>

  <!-- CUSTOMER -->
  <g>
    <rect x="420" y="80" width="200" height="74" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="420" y="80" width="200" height="24" rx="6" fill="#0284c7"/>
    <text x="520" y="97" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">CUSTOMER</text>
    <text x="432" y="122" font-size="12" fill="#334155"><tspan font-weight="700">PK</tspan> customer_id</text>
    <text x="432" y="144" font-size="12" fill="#334155">customer_name</text>
  </g>

  <!-- ORDER_LINE -->
  <g>
    <rect x="380" y="430" width="230" height="162" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="380" y="430" width="230" height="24" rx="6" fill="#0284c7"/>
    <text x="495" y="447" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">ORDER_LINE</text>
    <text x="392" y="472" font-size="12" fill="#334155"><tspan font-weight="700">PK</tspan> order_id</text>
    <text x="392" y="494" font-size="12" fill="#334155">order_date</text>
    <text x="392" y="516" font-size="12" fill="#334155"><tspan font-weight="700">FK</tspan> customer_id</text>
    <text x="392" y="538" font-size="12" fill="#334155"><tspan font-weight="700">FK</tspan> product</text>
    <text x="392" y="560" font-size="12" fill="#334155">quantity</text>
    <text x="392" y="582" font-size="12" fill="#334155">unit_price</text>
  </g>

  <!-- INVOICE -->
  <g>
    <rect x="760" y="80" width="210" height="96" rx="6" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="760" y="80" width="210" height="24" rx="6" fill="#7c3aed"/>
    <text x="865" y="97" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">INVOICE</text>
    <text x="772" y="122" font-size="12" fill="#334155"><tspan font-weight="700">PK</tspan> invoice_id</text>
    <text x="772" y="144" font-size="12" fill="#334155">issued</text>
    <text x="772" y="166" font-size="12" fill="#334155"><tspan font-weight="700">FK</tspan> customer_id</text>
  </g>

  <!-- INVOICE_LINE -->
  <g>
    <rect x="760" y="420" width="210" height="140" rx="6" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="760" y="420" width="210" height="24" rx="6" fill="#7c3aed"/>
    <text x="865" y="437" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">INVOICE_LINE</text>
    <text x="772" y="462" font-size="12" fill="#334155"><tspan font-weight="700">PK</tspan> line_id</text>
    <text x="772" y="484" font-size="12" fill="#334155"><tspan font-weight="700">FK</tspan> invoice_id</text>
    <text x="772" y="506" font-size="12" fill="#334155"><tspan font-weight="700">FK</tspan> product</text>
    <text x="772" y="528" font-size="12" fill="#334155">qty</text>
    <text x="772" y="550" font-size="12" fill="#334155">amount</text>
  </g>
</svg>
