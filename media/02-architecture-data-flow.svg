<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="640" fill="#ffffff"/>
  <text x="490" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Pipeline Data Flow — Modules &amp; Datasets</text>

  <!-- Sources subgraph -->
  <rect x="150" y="56" width="680" height="80" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="170" y="76" font-size="12" font-weight="600" fill="#64748b">Sources</text>
  <rect x="200" y="86" width="230" height="40" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="315" y="111" text-anchor="middle" font-size="13" font-weight="600" fill="#0c4a6e">generate_orders.py</text>
  <rect x="560" y="86" width="230" height="40" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="675" y="111" text-anchor="middle" font-size="13" font-weight="600" fill="#4c1d95">generate_invoices.py</text>

  <!-- Landing datasets -->
  <rect x="200" y="176" width="230" height="44" rx="22" fill="#f1f5f9" stroke="#64748b"/>
  <text x="315" y="203" text-anchor="middle" font-size="12.5" fill="#334155">landing/orders/*.csv</text>
  <rect x="560" y="176" width="230" height="44" rx="22" fill="#f1f5f9" stroke="#64748b"/>
  <text x="675" y="203" text-anchor="middle" font-size="12.5" fill="#334155">landing/invoices/*.xml</text>

  <!-- Bronze modules -->
  <rect x="200" y="262" width="230" height="40" rx="8" fill="#fde9d9" stroke="#c2703d"/>
  <text x="315" y="287" text-anchor="middle" font-size="13" font-weight="600" fill="#7c3f19">bronze_orders.py</text>
  <rect x="560" y="262" width="230" height="40" rx="8" fill="#fde9d9" stroke="#c2703d"/>
  <text x="675" y="287" text-anchor="middle" font-size="13" font-weight="600" fill="#7c3f19">bronze_invoices.py</text>

  <!-- Bronze datasets -->
  <rect x="200" y="326" width="230" height="44" rx="22" fill="#fdf1e7" stroke="#c2703d"/>
  <text x="315" y="353" text-anchor="middle" font-size="12.5" fill="#7c3f19">bronze/orders</text>
  <rect x="560" y="326" width="230" height="44" rx="22" fill="#fdf1e7" stroke="#c2703d"/>
  <text x="675" y="353" text-anchor="middle" font-size="12.5" fill="#7c3f19">bronze/invoices (+ manifest)</text>

  <!-- Silver module -->
  <rect x="380" y="410" width="230" height="40" rx="8" fill="#e5e7eb" stroke="#6b7280"/>
  <text x="495" y="435" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">silver.py</text>

  <!-- Silver datasets -->
  <rect x="235" y="474" width="230" height="44" rx="22" fill="#eef1f5" stroke="#6b7280"/>
  <text x="350" y="501" text-anchor="middle" font-size="12.5" fill="#374151">silver/sales</text>
  <rect x="525" y="474" width="230" height="44" rx="22" fill="#fef2f2" stroke="#dc2626"/>
  <text x="640" y="501" text-anchor="middle" font-size="12.5" fill="#991b1b">silver/_quarantine</text>

  <!-- Gold module -->
  <rect x="235" y="556" width="230" height="40" rx="8" fill="#fdf3c7" stroke="#d4af37"/>
  <text x="350" y="581" text-anchor="middle" font-size="13" font-weight="700" fill="#8a6d1a">gold.py</text>

  <!-- Gold outputs -->
  <g font-size="11.5" fill="#8a6d1a">
    <rect x="525" y="536" width="200" height="26" rx="13" fill="#fdf8e0" stroke="#d4af37"/>
    <text x="625" y="553" text-anchor="middle">daily_revenue</text>
    <rect x="525" y="568" width="200" height="26" rx="13" fill="#fdf8e0" stroke="#d4af37"/>
    <text x="625" y="585" text-anchor="middle">revenue_by_category</text>
    <rect x="745" y="536" width="200" height="26" rx="13" fill="#fdf8e0" stroke="#d4af37"/>
    <text x="845" y="553" text-anchor="middle">top_customers</text>
    <rect x="745" y="568" width="200" height="26" rx="13" fill="#fdf8e0" stroke="#d4af37"/>
    <text x="845" y="585" text-anchor="middle">revenue_by_source</text>
  </g>

  <!-- Arrows -->
  <g stroke="#475569" stroke-width="1.7" fill="none">
    <line x1="315" y1="126" x2="315" y2="174" marker-end="url(#arrow)"/>
    <line x1="675" y1="126" x2="675" y2="174" marker-end="url(#arrow)"/>
    <line x1="315" y1="220" x2="315" y2="260" marker-end="url(#arrow)"/>
    <line x1="675" y1="220" x2="675" y2="260" marker-end="url(#arrow)"/>
    <line x1="315" y1="302" x2="315" y2="324" marker-end="url(#arrow)"/>
    <line x1="675" y1="302" x2="675" y2="324" marker-end="url(#arrow)"/>
    <line x1="315" y1="370" x2="450" y2="408" marker-end="url(#arrow)"/>
    <line x1="675" y1="370" x2="540" y2="408" marker-end="url(#arrow)"/>
    <line x1="460" y1="450" x2="380" y2="472" marker-end="url(#arrow)"/>
    <line x1="530" y1="450" x2="610" y2="472" marker-end="url(#arrow)"/>
    <line x1="350" y1="518" x2="350" y2="554" marker-end="url(#arrow)"/>
    <line x1="465" y1="576" x2="523" y2="562" marker-end="url(#arrow)"/>
    <line x1="465" y1="580" x2="743" y2="562" marker-end="url(#arrow)"/>
  </g>

  <!-- edge labels -->
  <g font-size="10.5" fill="#64748b">
    <text x="325" y="150" >messy CSV</text>
    <text x="685" y="150" >SOAP/XML</text>
    <text x="325" y="248" >+ metadata</text>
    <text x="620" y="248" >verbatim + manifest</text>
    <text x="640" y="466" fill="#991b1b">invalid + reason</text>
  </g>
</svg>
